name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Fast checks (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js for extension checks
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Install Rust stable with required components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run canonical checks
        run: ./scripts/check.sh

  package:
    name: Ubuntu ${{ matrix.release }} package build
    needs: checks
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "24.04"
            runner: ubuntu-24.04
          - release: "26.04"
            runner: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install package build dependencies
        uses: ./.github/actions/install-package-build-dependencies

      - name: Build and validate the Ubuntu package
        run: ./scripts/build-deb.sh

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnomeengine-package-candidate-built-on-ubuntu-${{ matrix.release }}
          path: |
            dist/gnomeengine_*_amd64.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  m7-gnome46-validation-package:
    name: M7 GNOME 46 validation package (Ubuntu 24.04)
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install package build dependencies
        uses: ./.github/actions/install-package-build-dependencies

      - name: Build the temporary GNOME 46 validation package
        run: ./scripts/build-m7-gnome46-validation-deb.sh

      - name: Verify the validation artifact and unchanged production metadata
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -print
          mapfile -t packages < <(find dist -maxdepth 1 -type f \
            -name 'gnomeengine_*~m7test46*_ubuntu24.04_amd64.deb' -print)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            printf 'expected exactly one M7 GNOME 46 .deb, found %s\n' "${#packages[@]}" >&2
            exit 1
          fi
          deb="${packages[0]}"
          dpkg-deb -I "$deb"

          package="$(dpkg-deb --field "$deb" Package)"
          version="$(dpkg-deb --field "$deb" Version)"
          architecture="$(dpkg-deb --field "$deb" Architecture)"
          depends="$(dpkg-deb --field "$deb" Depends | tr '\n' ' ')"
          [[ "$package" == gnomeengine ]]
          [[ "$version" == *'~m7test46'* ]]
          [[ "$architecture" == amd64 ]]
          grep -Eq 'gnome-shell \(>= 46\)' <<<"$depends"
          ! grep -Eq 'gnome-shell \(>= 50\)' <<<"$depends"

          inspect_dir="$(mktemp -d)"
          trap 'rm -rf "$inspect_dir"' EXIT
          dpkg-deb --extract "$deb" "$inspect_dir"
          metadata="$inspect_dir/usr/share/gnome-shell/extensions/gnomeengine@mvk999.github.io/metadata.json"
          python3 - "$metadata" <<'PY'
          import json
          import sys
          from pathlib import Path

          metadata = json.loads(Path(sys.argv[1]).read_text())
          if metadata.get("uuid") != "gnomeengine@mvk999.github.io":
              raise SystemExit("packaged extension UUID is incorrect")
          if "46" not in metadata.get("shell-version", []):
              raise SystemExit("validation artifact extension metadata does not include GNOME Shell 46")
          print(f"Packaged extension shell-version: {metadata['shell-version']}")
          PY

          checksum_file="${deb}.sha256"
          test -s "$checksum_file"
          (cd "$(dirname "$deb")" && sha256sum --check "$(basename "$checksum_file")")
          git diff --exit-code -- debian/control extension/metadata.json

      - name: Upload M7 GNOME 46 validation package
        uses: actions/upload-artifact@v4
        with:
          name: gnomeengine-m7-gnome46-validation-package
          path: |
            dist/*~m7test46*_ubuntu24.04_amd64.deb
            dist/*~m7test46*_ubuntu24.04_amd64.deb.sha256
          if-no-files-found: error
          retention-days: 7

  noble-package-on-resolute:
    name: Check Noble-built package dependency resolution on Ubuntu 26.04
    needs: package
    runs-on: ubuntu-26.04
    steps:
      - name: Download Noble ABI-baseline package
        uses: actions/download-artifact@v4
        with:
          name: gnomeengine-package-candidate-built-on-ubuntu-24.04
          path: dist

      - name: Verify package metadata and APT dependency resolution
        run: |
          set -euo pipefail
          deb_file="$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_file"
          dpkg-deb --info "$deb_file"
          sudo apt-get update
          sudo apt-get install --simulate "$PWD/$deb_file"

  release:
    name: Publish validated tagged Debian artifact
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      vars.GNOMEENGINE_RELEASE_RUNTIME_VALIDATED == 'true'
    needs: noble-package-on-resolute
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged release assets
        uses: actions/checkout@v4

      - name: Set up Node.js for asset manifest validation
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require complete, licensed built-in wallpaper assets
        env:
          GNOMEENGINE_REQUIRE_STARTER_ASSETS: "1"
        run: ./scripts/check-starter-wallpapers.sh

      - name: Download Noble ABI-baseline package
        uses: actions/download-artifact@v4
        with:
          name: gnomeengine-package-candidate-built-on-ubuntu-24.04
          path: dist

      - name: Confirm release tag matches the packaged product version
        run: |
          set -euo pipefail
          deb_file="$(find dist -maxdepth 1 -type f -name '*.deb' -print -quit)"
          package_version="$(dpkg-deb --field "$deb_file" Version | sed -E 's/-[0-9][A-Za-z0-9.+~]*$//')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$package_version"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
            --verify-tag \
            --title "GnomeEngine $release_version" \
            --notes "Ubuntu 24.04 ABI-baseline amd64 package for the validated Ubuntu 24.04 / 26.04 GNOME matrix. Published only after M7 runtime validation is approved."
